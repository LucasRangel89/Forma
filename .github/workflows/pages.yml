name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forma-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar qualidade e regras locais
        run: |
          npm run lint
          npm test
          npm run test:local
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /Forma
      - run: npm run typecheck
      - name: Instalar Chromium para testes
        run: npx playwright install --with-deps chromium
      - name: Testar a versão estática
        run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # PRs and manual runs from feature branches verify the build only. Publishing
    # remains an explicit consequence of merging/pushing to the default branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
